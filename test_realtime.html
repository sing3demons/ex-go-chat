<!DOCTYPE html>
<html>
<head>
    <title>Realtime Chat Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; background: #f0f0f0; border-radius: 5px; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px 20px; }
        .status { margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Realtime Chat Test</h1>
        <div class="status" id="status">Disconnected</div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
        <div>
            <button onclick="connect()">Connect as testuser</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>
    </div>

    <script>
        let ws = null;
        const token1 = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2OTY3Yjk1ZGRhMjhiOWZiYmEwYTE4NzUiLCJ1c2VybmFtZSI6InRlc3R1c2VyIiwiZXhwIjoxNzY4NzAwNzg2LCJuYmYiOjE3Njg2MTQzODYsImlhdCI6MTc2ODYxNDM4Nn0.9Cg5W38Cb87gkOEfXLgGoBe-Hmwcv5G7zySuMiDWLog";
        const roomId = '696b02347d48e8e6de7d5752';
        
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }
        
        function addMessage(content, sender) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.textContent = `[${new Date().toLocaleTimeString()}] ${sender}: ${content}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function connect() {
            if (ws) {
                ws.close();
            }
            
            updateStatus('Connecting...');
            ws = new WebSocket(`ws://localhost:8080/ws?token=${token1}`);
            
            ws.onopen = function() {
                updateStatus('Connected as testuser');
                console.log('✅ Connected to WebSocket');
            };
            
            ws.onmessage = function(event) {
                console.log('📨 Raw message:', event.data);
                
                // Handle multiple JSON messages
                const messages = event.data.trim().split('\n');
                for (const messageData of messages) {
                    if (messageData.trim()) {
                        try {
                            const msg = JSON.parse(messageData);
                            console.log('📨 Parsed message:', msg);
                            
                            if (msg.type === 'message') {
                                addMessage(msg.payload.content, msg.payload.senderId);
                            }
                        } catch (error) {
                            console.error('Failed to parse message:', error);
                        }
                    }
                }
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateStatus('Error');
            };
            
            ws.onclose = function() {
                updateStatus('Disconnected');
                console.log('WebSocket closed');
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }
            
            const message = {
                type: 'message',
                roomId: roomId,
                payload: {
                    content: content,
                    tempId: `temp-${Date.now()}`
                }
            };
            
            console.log('📤 Sending message:', message);
            ws.send(JSON.stringify(message));
            input.value = '';
        }
        
        // Allow Enter key to send message
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
